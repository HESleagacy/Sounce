# docker-compose.yml  –  local development / testing
#
# Usage:
#   cp .env.example .env   # then fill in your real values
#   docker compose up --build
#
services:
  bot:
    build: .
    container_name: sounce
    restart: unless-stopped
    ports:
      - "8080:8080"            # health-check endpoint (optional locally)
    volumes:
      - ./.env:/app/.env:ro     # keep credentials out of container metadata
      - ./data:/app/data       # persist DB, session, and media across restarts
    # /live reports the process wedged once WhatsApp has been down past the
    # grace period. Compose's restart policy does not act on health, so the
    # in-process watchdog is what actually restarts it here; this is for
    # orchestrators that do (Railway, Swarm, k8s) and for `docker ps`.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
