[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sounce"
version = "0.1.0"
description = "A private multilingual WhatsApp assistant"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "google-genai==1.75.0",
    "google-auth==2.56.3",
    "httpx>=0.28,<1",
    "neonize>=0.4.3,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<5",
    "pip-tools>=7.4,<8",
]

[project.scripts]
sounce = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "B008",    # FastAPI-style default calls; not relevant here
    "SIM108",  # ternaries are not always clearer
    "UP017",   # datetime.UTC is 3.11+; timezone.utc keeps the 3.10 floor
    "UP042",   # StrEnum is 3.11+, same reason
]

[tool.ruff.lint.per-file-ignores]
# Tests lean on long literal fixtures and deliberately broad assertions.
"tests/*" = ["E501"]
"migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.10"
files = ["app"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["neonize.*", "google.genai.*", "httpcore.*", "alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Migrations are Alembic-generated scripts, not application code.
module = ["migrations.*"]
ignore_errors = true

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/providers/google_oauth.py"]

[tool.coverage.report]
# The bar is set at what the suite actually covers today, so it can only be
# raised deliberately rather than drifting down unnoticed.
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
